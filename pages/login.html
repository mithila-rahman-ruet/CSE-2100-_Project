<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Sign Up - RUET Connect</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>

    <style>
        /* Animated background blobs */
        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.4;
            animation: float 12s infinite ease-in-out;
        }
        .blob1 { width: 320px; height: 320px; background: #3b82f6; top: -80px; left: -80px; }
        .blob2 { width: 280px; height: 280px; background: #8b5cf6; bottom: -60px; right: -60px; animation-delay: 3s; }
        .blob3 { width: 220px; height: 220px; background: #06b6d4; top: 40%; left: 60%; animation-delay: 6s; }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -40px) scale(1.05); }
            66% { transform: translate(-20px, 20px) scale(0.95); }
        }
    </style>
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center p-4 relative overflow-hidden">

    <!-- Animated Background -->
    <div class="blob blob1"></div>
    <div class="blob blob2"></div>
    <div class="blob blob3"></div>

    <div class="relative z-10 bg-white/95 backdrop-blur-xl rounded-2xl shadow-2xl w-full max-w-md overflow-hidden border border-white/20">

        <!-- Top Navigation / Back to Home -->
        <div class="bg-blue-950 px-6 py-2.5 flex items-center justify-between text-xs text-blue-200 border-b border-blue-900">
            <a href="../index.html" class="flex items-center gap-1.5 hover:text-white transition">
                <span>←</span> Back to Home
            </a>
            <span class="font-mono">RUET Connect Auth</span>
        </div>

        <!-- Header -->
        <div class="bg-gradient-to-r from-blue-900 to-indigo-800 text-white text-center py-6 px-4">
            <div class="text-3xl mb-1">🎓</div>
            <h1 class="text-2xl font-bold">RUET Connect</h1>
            <p class="text-blue-200 text-xs mt-1">Dedicated Platform for RUET Students</p>
        </div>

        <!-- Already Logged In Banner -->
        <div id="alreadyLoggedInBanner" class="hidden bg-blue-50 border-b border-blue-200 p-4 text-center text-sm text-blue-900 flex flex-col items-center gap-2">
            <div>You are currently logged in as <span id="bannerUserEmail" class="font-semibold text-blue-800"></span></div>
            <div class="flex items-center gap-2 mt-1">
                <a href="../index.html" class="bg-blue-700 text-white px-4 py-1.5 rounded-lg text-xs font-medium hover:bg-blue-800 transition">
                    Continue to Home →
                </a>
                <button onclick="logout()" class="bg-gray-200 text-gray-800 px-4 py-1.5 rounded-lg text-xs font-medium hover:bg-gray-300 transition">
                    Switch Account
                </button>
            </div>
        </div>

        <!-- Tabs -->
        <div class="flex border-b text-sm font-semibold">
            <button id="loginTab" class="flex-1 py-3 text-blue-900 border-b-2 border-blue-900 transition">
                Sign In
            </button>
            <button id="signupTab" class="flex-1 py-3 text-gray-500 hover:text-blue-900 transition">
                Create Account
            </button>
        </div>

        <!-- ==================== LOGIN FORM ==================== -->
        <div id="loginForm" class="p-6">
            <form onsubmit="handleLogin(event)">
                <div class="mb-4">
                    <label class="block text-gray-700 text-xs font-semibold uppercase tracking-wider mb-1.5">RUET Student Email *</label>
                    <input type="email" id="loginEmail" placeholder="e.g. 2103050@student.ruet.ac.bd" required
                        class="w-full px-4 py-2.5 border border-gray-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div class="mb-6">
                    <label class="block text-gray-700 text-xs font-semibold uppercase tracking-wider mb-1.5">Password *</label>
                    <input type="password" id="loginPassword" placeholder="Enter your password" required
                        class="w-full px-4 py-2.5 border border-gray-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <button type="submit" id="loginSubmitBtn" class="w-full bg-blue-700 hover:bg-blue-800 text-white font-medium py-3 rounded-xl transition shadow-md flex items-center justify-center gap-2">
                    <span>Sign In</span>
                </button>
            </form>
            <p id="loginError" class="text-red-600 text-sm mt-3 text-center hidden bg-red-50 p-2.5 rounded-lg border border-red-200"></p>
        </div>

        <!-- ==================== SIGNUP FORM ==================== -->
        <div id="signupForm" class="p-6 hidden max-h-[70vh] overflow-y-auto">
            <form onsubmit="handleSignup(event)">
                <div class="mb-3">
                    <label class="block text-gray-700 text-xs font-semibold uppercase tracking-wider mb-1">Full Name *</label>
                    <input type="text" id="signupName" placeholder="e.g. Abdur Rahim" required
                        class="w-full px-4 py-2.5 border border-gray-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <div class="mb-3">
                    <label class="block text-gray-700 text-xs font-semibold uppercase tracking-wider mb-1">RUET Student Email *</label>
                    <input type="email" id="signupEmail" placeholder="2103050@student.ruet.ac.bd" required
                        class="w-full px-4 py-2.5 border border-gray-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <p class="text-[11px] text-gray-400 mt-1">Must be your institutional student email ending in @student.ruet.ac.bd</p>
                </div>

                <div class="mb-3">
                    <label class="block text-gray-700 text-xs font-semibold uppercase tracking-wider mb-1">Password *</label>
                    <input type="password" id="signupPassword" placeholder="Min 6 characters (letters & numbers)" required
                        class="w-full px-4 py-2.5 border border-gray-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <div class="grid grid-cols-2 gap-3 mb-3">
                    <div>
                        <label class="block text-gray-700 text-xs font-semibold uppercase tracking-wider mb-1">Blood Group *</label>
                        <select id="signupBlood" required class="w-full px-3 py-2.5 border border-gray-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <option value="">Select</option>
                            <option value="A+">A+</option>
                            <option value="A-">A-</option>
                            <option value="B+">B+</option>
                            <option value="B-">B-</option>
                            <option value="AB+">AB+</option>
                            <option value="AB-">AB-</option>
                            <option value="O+">O+</option>
                            <option value="O-">O-</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-gray-700 text-xs font-semibold uppercase tracking-wider mb-1">Department *</label>
                        <select id="signupDept" required class="w-full px-3 py-2.5 border border-gray-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <option value="">Select</option>
                            <option value="CSE">CSE</option>
                            <option value="EEE">EEE</option>
                            <option value="ME">ME</option>
                            <option value="CE">CE</option>
                            <option value="ECE">ECE</option>
                            <option value="IPE">IPE</option>
                            <option value="ETE">ETE</option>
                            <option value="Arch">Arch</option>
                            <option value="ChE">ChE</option>
                            <option value="URP">URP</option>
                            <option value="BECM">BECM</option>
                            <option value="CME">CME</option>
                            <option value="MSE">MSE</option>
                            <option value="MTE">MTE</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3 mb-3">
                    <div>
                        <label class="block text-gray-700 text-xs font-semibold uppercase tracking-wider mb-1">Current Semester *</label>
                        <select id="signupSemester" required class="w-full px-3 py-2.5 border border-gray-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <option value="">Select</option>
                            <option value="1-1">1-1</option>
                            <option value="1-2">1-2</option>
                            <option value="2-1">2-1</option>
                            <option value="2-2">2-2</option>
                            <option value="3-1">3-1</option>
                            <option value="3-2">3-2</option>
                            <option value="4-1">4-1</option>
                            <option value="4-2">4-2</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-gray-700 text-xs font-semibold uppercase tracking-wider mb-1">Residential Hall *</label>
                        <select id="signupHall" required class="w-full px-3 py-2.5 border border-gray-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <option value="">Select Hall</option>
                            <optgroup label="Male Halls">
                                <option value="Shahid Lt. Selim Hall">Shahid Lt. Selim Hall</option>
                                <option value="Shahid Shahidul Islam Hall">Shahid Shahidul Islam Hall</option>
                                <option value="Shahid Abdul Hamid Hall">Shahid Abdul Hamid Hall</option>
                                <option value="Tin Shed Hall (Extension)">Tin Shed Hall (Extension)</option>
                                <option value="Shahid President Ziaur Rahman Hall">Shahid President Ziaur Rahman Hall</option>
                                <option value="Sher-e-Bangla A. K. Fazlul Huq Hall">Sher-e-Bangla A. K. Fazlul Huq Hall</option>
                                <option value="Male Hall-1">Male Hall-1</option>
                                <option value="Male Hall-2">Male Hall-2</option>
                                <option value="Male Hall-3">Male Hall-3</option>
                            </optgroup>
                            <optgroup label="Female Halls">
                                <option value="Female Hall-1">Female Hall-1</option>
                                <option value="Female Hall-2">Female Hall-2</option>
                            </optgroup>
                        </select>
                    </div>
                </div>

                <div class="mb-4 flex items-center gap-2 p-3 bg-blue-50/70 rounded-xl border border-blue-100">
                    <input type="checkbox" id="signupDonate" class="w-4 h-4 text-blue-600 rounded">
                    <label for="signupDonate" class="text-xs text-gray-700 font-medium">
                        I am willing to donate blood in emergency cases
                    </label>
                </div>

                <button type="submit" id="signupSubmitBtn" class="w-full bg-green-600 hover:bg-green-700 text-white font-medium py-3 rounded-xl transition shadow-md flex items-center justify-center gap-2">
                    <span>Create Account</span>
                </button>
            </form>
            <p id="signupError" class="text-red-600 text-sm mt-3 text-center hidden bg-red-50 p-2.5 rounded-lg border border-red-200"></p>
        </div>
    </div>

    <script src="../js/firebase.js"></script>

    <script>
        // Check if already authenticated
        auth.onAuthStateChanged((user) => {
            if (user) {
                const banner = document.getElementById('alreadyLoggedInBanner');
                const emailSpan = document.getElementById('bannerUserEmail');
                if (banner && emailSpan) {
                    emailSpan.textContent = user.email;
                    banner.classList.remove('hidden');
                }
            }
        });

        // Tab switching
        const loginTab = document.getElementById('loginTab');
        const signupTab = document.getElementById('signupTab');
        const loginForm = document.getElementById('loginForm');
        const signupForm = document.getElementById('signupForm');

        loginTab.onclick = () => {
            loginTab.className = "flex-1 py-3 text-blue-900 border-b-2 border-blue-900 transition";
            signupTab.className = "flex-1 py-3 text-gray-500 hover:text-blue-900 transition";
            loginForm.classList.remove('hidden');
            signupForm.classList.add('hidden');
        };

        signupTab.onclick = () => {
            signupTab.className = "flex-1 py-3 text-blue-900 border-b-2 border-blue-900 transition";
            loginTab.className = "flex-1 py-3 text-gray-500 hover:text-blue-900 transition";
            signupForm.classList.remove('hidden');
            loginForm.classList.add('hidden');
        };

        function isRuetEmail(email) {
            return email.toLowerCase().endsWith("@student.ruet.ac.bd");
        }

        function isStrongPassword(password) {
            const hasLetter = /[a-zA-Z]/.test(password);
            const hasNumber = /[0-9]/.test(password);
            return password.length >= 6 && hasLetter && hasNumber;
        }

        // ========== LOGIN ==========
        function handleLogin(event) {
            event.preventDefault();
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;
            const errorMsg = document.getElementById('loginError');
            const submitBtn = document.getElementById('loginSubmitBtn');

            errorMsg.classList.add('hidden');

            if (!email || !password) {
                errorMsg.textContent = "Please fill in all fields.";
                errorMsg.classList.remove('hidden');
                return;
            }

            if (!isRuetEmail(email)) {
                errorMsg.textContent = "Only RUET student email (@student.ruet.ac.bd) is allowed.";
                errorMsg.classList.remove('hidden');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerHTML = `<span>Signing In...</span>`;

            auth.signInWithEmailAndPassword(email, password)
                .then(() => {
                    window.location.href = "../index.html";
                })
                .catch((error) => {
                    let msg = "Failed to sign in. Please verify your email and password.";
                    if (error.code === 'auth/user-not-found') msg = "No user found with this email.";
                    else if (error.code === 'auth/wrong-password') msg = "Incorrect password.";
                    else if (error.code === 'auth/invalid-credential') msg = "Invalid email or password.";
                    else if (error.message) msg = error.message;

                    errorMsg.textContent = msg;
                    errorMsg.classList.remove('hidden');
                })
                .finally(() => {
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = `<span>Sign In</span>`;
                });
        }

        // ========== SIGNUP ==========
        function handleSignup(event) {
            event.preventDefault();
            const name = document.getElementById('signupName').value.trim();
            const email = document.getElementById('signupEmail').value.trim();
            const password = document.getElementById('signupPassword').value;
            const blood = document.getElementById('signupBlood').value;
            const hall = document.getElementById('signupHall').value;
            const dept = document.getElementById('signupDept').value;
            const semester = document.getElementById('signupSemester').value;
            const willingToDonate = document.getElementById('signupDonate').checked;
            const errorMsg = document.getElementById('signupError');
            const submitBtn = document.getElementById('signupSubmitBtn');

            errorMsg.classList.add('hidden');

            if (!name || !email || !password || !blood || !hall || !dept || !semester) {
                errorMsg.textContent = "Please complete all required fields.";
                errorMsg.classList.remove('hidden');
                return;
            }

            if (!isRuetEmail(email)) {
                errorMsg.textContent = "Only RUET student email (@student.ruet.ac.bd) is allowed.";
                errorMsg.classList.remove('hidden');
                return;
            }

            if (!isStrongPassword(password)) {
                errorMsg.textContent = "Password must be at least 6 characters and include letters and numbers.";
                errorMsg.classList.remove('hidden');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerHTML = `<span>Creating Account...</span>`;

            auth.createUserWithEmailAndPassword(email, password)
                .then((userCredential) => {
                    const user = userCredential.user;
                    user.updateProfile({ displayName: name }).catch(() => {});

                    const studentId = email.split('@')[0];
                    return db.collection("users").doc(user.uid).set({
                        name: name,
                        email: email,
                        studentId: studentId,
                        bloodGroup: blood,
                        hall: hall,
                        department: dept,
                        semester: semester,
                        willingToDonate: willingToDonate,
                        role: "student",
                        createdAt: new Date()
                    });
                })
                .then(() => {
                    window.location.href = "../index.html";
                })
                .catch((error) => {
                    let msg = error.message || "Failed to create account.";
                    if (error.code === 'auth/email-already-in-use') msg = "This student email is already registered.";
                    errorMsg.textContent = msg;
                    errorMsg.classList.remove('hidden');
                })
                .finally(() => {
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = `<span>Create Account</span>`;
                });
        }
    </script>
</body>
</html>
