<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes Vault - RUET Connect</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>

    <style>
        .note-card { transition: all 0.2s ease; }
        .note-card:hover { transform: translateY(-2px); }
    </style>
</head>
<body class="bg-gray-50 text-gray-800">

    <!-- ==================== GLOBAL NAVBAR ==================== -->
    <nav id="mainNavbar" class="bg-blue-950 text-white shadow-lg sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
            <a href="../index.html" class="flex items-center gap-2">
                <span class="text-2xl">🎓</span>
                <span class="text-xl font-bold tracking-wide">RUET CONNECT</span>
            </a>
            <div class="h-8 w-24 bg-blue-900/60 rounded-lg animate-pulse"></div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-6xl mx-auto px-4 py-10">

        <!-- Header -->
        <div class="bg-white rounded-2xl shadow-sm border border-blue-100 p-6 mb-8 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div>
                <h1 class="text-3xl font-bold text-blue-950">Notes Vault</h1>
                <p class="text-gray-500 mt-1">Access and share academic course notes, slide summaries, and exam resources</p>
            </div>
            <button onclick="openUploadModal()" 
                class="bg-blue-700 hover:bg-blue-800 text-white px-6 py-3 rounded-xl font-medium shadow-md transition flex items-center gap-2">
                <span>📄</span> + Add New Note
            </button>
        </div>

        <!-- Filters -->
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-5 mb-8">
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1">Department</label>
                    <select id="filterDept" onchange="applyFilters()" class="w-full px-3.5 py-2.5 border border-gray-200 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 bg-white">
                        <option value="">All Departments</option>
                        <option value="CSE">CSE</option><option value="EEE">EEE</option><option value="ME">ME</option>
                        <option value="CE">CE</option><option value="ECE">ECE</option><option value="IPE">IPE</option>
                        <option value="ETE">ETE</option><option value="Arch">Arch</option><option value="ChE">ChE</option>
                        <option value="URP">URP</option><option value="BECM">BECM</option><option value="CME">CME</option>
                        <option value="MSE">MSE</option><option value="MTE">MTE</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1">Semester</label>
                    <select id="filterSemester" onchange="applyFilters()" class="w-full px-3.5 py-2.5 border border-gray-200 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 bg-white">
                        <option value="">All Semesters</option>
                        <option value="1-1">1-1</option><option value="1-2">1-2</option>
                        <option value="2-1">2-1</option><option value="2-2">2-2</option>
                        <option value="3-1">3-1</option><option value="3-2">3-2</option>
                        <option value="4-1">4-1</option><option value="4-2">4-2</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1">Subject / Course Code</label>
                    <input type="text" id="filterSubject" oninput="applyFilters()" placeholder="e.g. CSE 2103, Math..." 
                        class="w-full px-3.5 py-2.5 border border-gray-200 rounded-xl text-sm focus:ring-2 focus:ring-blue-500">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1">Teacher / Topic</label>
                    <input type="text" id="filterTeacher" oninput="applyFilters()" placeholder="Search teacher or keyword..." 
                        class="w-full px-3.5 py-2.5 border border-gray-200 rounded-xl text-sm focus:ring-2 focus:ring-blue-500">
                </div>
            </div>
        </div>

        <!-- Notes List -->
        <div id="notesList" class="space-y-5">
            <div class="bg-white rounded-2xl p-12 text-center border border-gray-100">
                <div class="w-10 h-10 border-4 border-blue-600 border-t-transparent rounded-full animate-spin mx-auto mb-3"></div>
                <p class="text-gray-400 text-sm">Loading academic notes...</p>
            </div>
        </div>

    </main>

    <!-- ==================== ADD NOTE MODAL ==================== -->
    <div id="uploadModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50 hidden p-4 overflow-y-auto">
        <div class="bg-white rounded-2xl w-full max-w-lg my-8 p-6 shadow-2xl border border-gray-100 animate-fade-up">
            <div class="flex justify-between items-center mb-5 pb-3 border-b border-gray-100">
                <div class="flex items-center gap-2">
                    <span class="text-xl">📄</span>
                    <h2 class="text-lg font-bold text-gray-900">Add Academic Note</h2>
                </div>
                <button onclick="closeUploadModal()" class="text-gray-400 hover:text-gray-600 text-2xl font-bold leading-none">&times;</button>
            </div>

            <form onsubmit="handleUploadNote(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-1">Note Title *</label>
                    <input type="text" id="noteTitle" placeholder="e.g. Digital Logic Design - Complete Chapter 3 Notes" required
                        class="w-full px-4 py-2.5 border border-gray-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-1">Subject / Course *</label>
                        <input type="text" id="noteSubject" placeholder="e.g. CSE 2103" required
                            class="w-full px-4 py-2.5 border border-gray-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-1">Course Teacher</label>
                        <input type="text" id="noteTeacher" placeholder="e.g. Dr. ..."
                            class="w-full px-4 py-2.5 border border-gray-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-1">Department *</label>
                        <select id="noteDept" required class="w-full px-3 py-2.5 border border-gray-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white">
                            <option value="">Select Dept</option>
                            <option value="CSE">CSE</option><option value="EEE">EEE</option><option value="ME">ME</option>
                            <option value="CE">CE</option><option value="ECE">ECE</option><option value="IPE">IPE</option>
                            <option value="ETE">ETE</option><option value="Arch">Arch</option><option value="ChE">ChE</option>
                            <option value="URP">URP</option><option value="BECM">BECM</option><option value="CME">CME</option>
                            <option value="MSE">MSE</option><option value="MTE">MTE</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-1">Semester *</label>
                        <select id="noteSemester" required class="w-full px-3 py-2.5 border border-gray-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white">
                            <option value="">Select Sem</option>
                            <option value="1-1">1-1</option><option value="1-2">1-2</option>
                            <option value="2-1">2-1</option><option value="2-2">2-2</option>
                            <option value="3-1">3-1</option><option value="3-2">3-2</option>
                            <option value="4-1">4-1</option><option value="4-2">4-2</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-1">Note Content & Summary *</label>
                    <textarea id="noteContent" rows="4" placeholder="Write summary, key topics, formulas, exam tips..." required
                        class="w-full px-4 py-2.5 border border-gray-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-1">Google Drive / PDF Link (Optional)</label>
                    <input type="url" id="noteLink" placeholder="https://drive.google.com/..."
                        class="w-full px-4 py-2.5 border border-gray-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <p class="text-[11px] text-gray-400 mt-1">Direct link to shared PDF, presentation, or folder</p>
                </div>

                <div class="flex items-center gap-3 p-3 bg-blue-50/70 rounded-xl border border-blue-100">
                    <input type="checkbox" id="noteAnonymous" class="w-4 h-4 text-blue-600 rounded">
                    <div>
                        <label for="noteAnonymous" class="text-xs font-semibold text-gray-800 cursor-pointer">Post Anonymously</label>
                        <p class="text-[11px] text-gray-500">Your name will not be shown to other students on the public note card</p>
                    </div>
                </div>

                <div id="uploadError" class="hidden text-red-600 text-xs bg-red-50 p-2.5 rounded-lg border border-red-200"></div>

                <div class="flex items-center justify-end gap-3 pt-3 border-t border-gray-100">
                    <button type="button" onclick="closeUploadModal()" class="px-4 py-2 text-sm text-gray-600 hover:text-gray-800 font-medium">
                        Cancel
                    </button>
                    <button type="submit" id="submitNoteBtn" class="bg-blue-700 hover:bg-blue-800 text-white font-medium px-6 py-2.5 rounded-xl text-sm transition shadow-md flex items-center gap-2">
                        <span>Post Note</span>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Firebase Logic -->
    <script src="../js/firebase.js"></script>

    <script>
        let allNotes = [];

        document.addEventListener("DOMContentLoaded", () => {
            const urlParams = new URLSearchParams(window.location.search);
            const q = urlParams.get('q');
            if (q) {
                const subInput = document.getElementById('filterSubject');
                if (subInput) subInput.value = q;
            }
            loadNotes();
        });

        function openUploadModal() {
            if (!auth || !auth.currentUser) {
                alert("Please log in first to share notes.");
                window.location.href = "login.html";
                return;
            }
            document.getElementById('uploadError').classList.add('hidden');
            document.getElementById('uploadModal').classList.remove('hidden');
        }

        function closeUploadModal() {
            document.getElementById('uploadModal').classList.add('hidden');
        }

        async function handleUploadNote(event) {
            event.preventDefault();
            const title = document.getElementById('noteTitle').value.trim();
            const subject = document.getElementById('noteSubject').value.trim();
            const teacher = document.getElementById('noteTeacher').value.trim();
            const dept = document.getElementById('noteDept').value;
            const semester = document.getElementById('noteSemester').value;
            const content = document.getElementById('noteContent').value.trim();
            const link = document.getElementById('noteLink').value.trim();
            const isAnonymous = document.getElementById('noteAnonymous').checked;
            const errorMsg = document.getElementById('uploadError');
            const submitBtn = document.getElementById('submitNoteBtn');

            errorMsg.classList.add('hidden');

            if (!title || !subject || !dept || !semester || !content) {
                errorMsg.textContent = "Please fill in all required fields.";
                errorMsg.classList.remove('hidden');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerHTML = `<span>Posting Note...</span>`;

            try {
                const user = auth.currentUser;
                const userDoc = await db.collection("users").doc(user.uid).get();
                const userData = userDoc.exists ? userDoc.data() : {};

                const noteData = {
                    title,
                    subject,
                    teacher,
                    department: dept,
                    semester,
                    content,
                    externalLink: link || null,
                    isAnonymous,
                    uploadedBy: user.uid,
                    uploadedByName: isAnonymous ? "Anonymous" : (userData.name || user.displayName || "Student"),
                    uploadedByStudentId: isAnonymous ? "" : (userData.studentId || (user.email ? user.email.split('@')[0] : "")),
                    views: 0,
                    createdAt: new Date()
                };

                await db.collection("notes").add(noteData);

                closeUploadModal();
                event.target.reset();
            } catch (err) {
                errorMsg.textContent = err.message || "Failed to post note.";
                errorMsg.classList.remove('hidden');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = `<span>Post Note</span>`;
            }
        }

        function loadNotes() {
            if (!db) return;
            db.collection("notes").orderBy("createdAt", "desc")
                .onSnapshot(snapshot => {
                    allNotes = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    applyFilters();
                }, err => {
                    console.error("Firestore read error:", err);
                    document.getElementById('notesList').innerHTML = `
                        <div class="bg-white rounded-2xl p-12 text-center border border-gray-100 text-red-500">
                            Failed to load notes. Please refresh the page.
                        </div>
                    `;
                });
        }

        function applyFilters() {
            const dept = document.getElementById('filterDept')?.value || '';
            const semester = document.getElementById('filterSemester')?.value || '';
            const subject = (document.getElementById('filterSubject')?.value || '').toLowerCase().trim();
            const teacher = (document.getElementById('filterTeacher')?.value || '').toLowerCase().trim();

            const filtered = allNotes.filter(note => {
                const matchDept = !dept || note.department === dept;
                const matchSem = !semester || note.semester === semester;
                const subjStr = (note.subject || '').toLowerCase();
                const titleStr = (note.title || '').toLowerCase();
                const matchSubj = !subject || subjStr.includes(subject) || titleStr.includes(subject);
                const teacherStr = (note.teacher || '').toLowerCase();
                const contentStr = (note.content || '').toLowerCase();
                const matchTeacher = !teacher || teacherStr.includes(teacher) || contentStr.includes(teacher);
                return matchDept && matchSem && matchSubj && matchTeacher;
            });

            renderNotes(filtered);
        }

        function renderNotes(notes) {
            const container = document.getElementById('notesList');
            if (notes.length === 0) {
                container.innerHTML = `
                    <div class="bg-white rounded-2xl p-12 text-center border border-gray-100">
                        <div class="text-4xl mb-3">📄</div>
                        <h3 class="text-lg font-bold text-gray-800">No notes found</h3>
                        <p class="text-sm text-gray-500 mt-1">No notes match your filter criteria.</p>
                        <button onclick="openUploadModal()" class="mt-4 bg-blue-700 hover:bg-blue-800 text-white text-xs font-medium px-4 py-2 rounded-xl transition">
                            + Share a Note
                        </button>
                    </div>
                `;
                return;
            }

            const currentUid = auth?.currentUser?.uid;

            container.innerHTML = notes.map(note => {
                const isOwner = currentUid && (note.uploadedBy === currentUid);
                const studentIdStr = (!note.isAnonymous && note.uploadedByStudentId) ? ` (ID: ${escapeHtml(note.uploadedByStudentId)})` : '';
                const dateStr = formatDate(note.createdAt);

                return `
                    <div class="note-card bg-white rounded-2xl border border-gray-100 shadow-sm p-6">
                        <div class="flex flex-col sm:flex-row justify-between items-start gap-2 mb-3">
                            <div>
                                <h3 class="text-xl font-bold text-gray-900">${escapeHtml(note.title)}</h3>
                                <p class="text-xs sm:text-sm text-gray-500 mt-1 flex flex-wrap items-center gap-1.5">
                                    <span>📚 ${escapeHtml(note.subject)}</span>
                                    <span>•</span>
                                    <span>Sem ${escapeHtml(note.semester)}</span>
                                    ${note.teacher ? `<span>•</span><span>👨‍🏫 ${escapeHtml(note.teacher)}</span>` : ''}
                                    ${dateStr ? `<span>•</span><span>📅 ${dateStr}</span>` : ''}
                                </p>
                            </div>
                            <span class="bg-blue-100 text-blue-800 text-xs font-bold px-3 py-1 rounded-full flex-shrink-0">
                                ${escapeHtml(note.department)}
                            </span>
                        </div>

                        <div class="bg-slate-50/80 rounded-xl p-4 text-gray-700 text-xs sm:text-sm whitespace-pre-wrap max-h-48 overflow-y-auto mb-4 border border-slate-100 leading-relaxed">
                            ${escapeHtml(note.content)}
                        </div>

                        <div class="flex flex-wrap justify-between items-center gap-3 pt-3 border-t border-gray-100 text-xs">
                            <div class="text-gray-500">
                                Posted by 
                                ${note.isAnonymous 
                                    ? '<span class="italic text-gray-400 font-medium">Anonymous Student</span>' 
                                    : `<a href="view-profile.html?id=${note.uploadedBy}" class="text-blue-700 hover:underline font-semibold">${escapeHtml(note.uploadedByName)}${studentIdStr}</a>`}
                            </div>

                            <div class="flex items-center gap-2">
                                ${note.externalLink ? `
                                    <a href="${escapeHtml(note.externalLink)}" target="_blank" rel="noopener noreferrer"
                                       class="bg-blue-50 hover:bg-blue-100 text-blue-700 text-xs px-3.5 py-1.5 rounded-lg font-medium transition flex items-center gap-1">
                                        <span>🔗</span> Open Link
                                    </a>
                                ` : ''}

                                ${isOwner ? `
                                    <button onclick="deleteNote('${note.id}')" 
                                            class="bg-red-50 hover:bg-red-100 text-red-700 text-xs px-3 py-1.5 rounded-lg font-medium transition flex items-center gap-1">
                                        <span>🗑️</span> Delete
                                    </button>
                                ` : ''}
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        async function deleteNote(noteId) {
            if (!confirm("Are you sure you want to delete this note?")) return;
            try {
                await db.collection("notes").doc(noteId).delete();
            } catch (err) {
                alert("Failed to delete note: " + err.message);
            }
        }
    </script>
</body>
</html>
