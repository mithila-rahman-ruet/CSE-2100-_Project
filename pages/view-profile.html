<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Profile - RUET Connect</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>
</head>
<body class="bg-gray-50 text-gray-800">

    <!-- ==================== GLOBAL NAVBAR ==================== -->
    <nav id="mainNavbar" class="bg-blue-950 text-white shadow-lg sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
            <a href="../index.html" class="flex items-center gap-2">
                <span class="text-2xl">🎓</span>
                <span class="text-xl font-bold tracking-wide">RUET CONNECT</span>
            </a>
            <div class="h-8 w-24 bg-blue-900/60 rounded-lg animate-pulse"></div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-4xl mx-auto px-4 py-10">
        <div id="profileContent">
            <div class="bg-white rounded-2xl p-16 text-center border border-gray-100 shadow-sm">
                <div class="w-8 h-8 border-3 border-blue-600 border-t-transparent rounded-full animate-spin mx-auto mb-2"></div>
                <p class="text-gray-400 text-sm">Loading student profile...</p>
            </div>
        </div>
    </main>

    <!-- Global Firebase Logic -->
    <script src="../js/firebase.js"></script>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const userId = urlParams.get('id');

        if (!userId) {
            document.getElementById('profileContent').innerHTML = `
                <div class="bg-white rounded-2xl p-12 text-center border border-gray-100 shadow-sm">
                    <div class="text-4xl mb-3">🔍</div>
                    <h2 class="text-xl font-bold text-gray-800">Student Not Found</h2>
                    <p class="text-sm text-gray-500 mt-1">No student ID was specified in the link.</p>
                    <a href="../index.html" class="inline-block mt-4 bg-blue-700 text-white text-xs font-medium px-5 py-2.5 rounded-xl transition">
                        ← Back to Home
                    </a>
                </div>
            `;
        } else {
            db.collection("users").doc(userId).get().then(doc => {
                if (!doc.exists) {
                    document.getElementById('profileContent').innerHTML = `
                        <div class="bg-white rounded-2xl p-12 text-center border border-gray-100 shadow-sm">
                            <div class="text-4xl mb-3">👤</div>
                            <h2 class="text-xl font-bold text-gray-800">User Not Found</h2>
                            <p class="text-sm text-gray-500 mt-1">This user profile does not exist or may have been removed.</p>
                            <a href="../index.html" class="inline-block mt-4 bg-blue-700 text-white text-xs font-medium px-5 py-2.5 rounded-xl transition">
                                ← Back to Home
                            </a>
                        </div>
                    `;
                    return;
                }

                const user = doc.data();
                const displayName = user.name || "RUET Student";
                const studentId = user.studentId || (user.email ? user.email.split('@')[0] : "-");
                const avatarHtml = getUserAvatarHtml({ ...user, name: displayName }, "w-24 h-24", "text-3xl");
                const isLoggedIn = !!auth?.currentUser;

                document.getElementById('profileContent').innerHTML = `
                    <!-- Profile Card -->
                    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 md:p-8 mb-8">
                        <div class="flex flex-col sm:flex-row items-center sm:items-start gap-6 text-center sm:text-left">
                            <div class="flex-shrink-0">
                                ${avatarHtml}
                            </div>
                            <div class="flex-1 min-w-0">
                                <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                                    <div>
                                        <h1 class="text-2xl md:text-3xl font-bold text-gray-900">${escapeHtml(displayName)}</h1>
                                        <p class="text-xs text-blue-700 font-mono font-medium mt-0.5">ID: ${escapeHtml(studentId)}</p>
                                    </div>
                                    <div>
                                        <span class="inline-block px-3 py-1 rounded-full text-xs font-semibold ${user.role === 'admin' ? 'bg-purple-100 text-purple-800' : 'bg-blue-100 text-blue-800'}">
                                            ${user.role === 'admin' ? 'Admin' : 'Verified Student'}
                                        </span>
                                    </div>
                                </div>

                                <div class="mt-4 flex flex-wrap gap-2 justify-center sm:justify-start">
                                    <span class="text-xs font-medium px-3 py-1 rounded-full ${user.willingToDonate ? 'bg-red-100 text-red-700' : 'bg-gray-100 text-gray-500'}">
                                        🩸 ${user.willingToDonate ? 'Willing to Donate Blood' : 'Not Donating Currently'}
                                    </span>
                                    ${user.phone && isLoggedIn ? `
                                        <a href="tel:${escapeHtml(user.phone)}" class="text-xs font-medium px-3 py-1 rounded-full bg-green-50 text-green-700 hover:bg-green-100 transition">
                                            📞 ${escapeHtml(user.phone)}
                                        </a>
                                    ` : ''}
                                </div>
                            </div>
                        </div>

                        <!-- Academic Details Grid -->
                        <div class="grid grid-cols-2 sm:grid-cols-4 gap-3.5 mt-8 pt-6 border-t border-gray-100">
                            <div class="bg-slate-50 rounded-xl p-3.5 border border-slate-100">
                                <p class="text-[11px] font-semibold text-gray-400 uppercase tracking-wider">Blood Group</p>
                                <p class="font-bold text-red-600 text-lg mt-1">${escapeHtml(user.bloodGroup || "-")}</p>
                            </div>
                            <div class="bg-slate-50 rounded-xl p-3.5 border border-slate-100">
                                <p class="text-[11px] font-semibold text-gray-400 uppercase tracking-wider">Department</p>
                                <p class="font-bold text-gray-800 text-base mt-1">${escapeHtml(user.department || "-")}</p>
                            </div>
                            <div class="bg-slate-50 rounded-xl p-3.5 border border-slate-100">
                                <p class="text-[11px] font-semibold text-gray-400 uppercase tracking-wider">Semester</p>
                                <p class="font-bold text-gray-800 text-base mt-1">${escapeHtml(user.semester || "-")}</p>
                            </div>
                            <div class="bg-slate-50 rounded-xl p-3.5 border border-slate-100">
                                <p class="text-[11px] font-semibold text-gray-400 uppercase tracking-wider">Hall</p>
                                <p class="font-bold text-gray-800 text-sm mt-1 truncate">${escapeHtml(user.hall || "-")}</p>
                            </div>
                        </div>
                    </div>

                    <!-- User's Lost & Found Posts -->
                    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 mb-8">
                        <h2 class="text-lg font-bold text-gray-900 mb-4 flex items-center gap-2">
                            <span>🔍</span> Posts by ${escapeHtml(displayName)}
                        </h2>
                        <div id="userPostsList" class="space-y-3">
                            <p class="text-gray-400 text-xs text-center py-4">Checking for campus posts...</p>
                        </div>
                    </div>

                    <!-- User's Products on Marketplace -->
                    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 mb-8">
                        <h2 class="text-lg font-bold text-gray-900 mb-4 flex items-center gap-2">
                            <span>🛒</span> Products Listed for Sale
                        </h2>
                        <div id="userProductsList" class="space-y-3">
                            <p class="text-gray-400 text-xs text-center py-4">Checking marketplace items...</p>
                        </div>
                    </div>

                    <div class="text-center">
                        <button onclick="history.back()" class="bg-slate-200 hover:bg-slate-300 text-gray-700 px-5 py-2 rounded-xl transition text-xs font-semibold">
                            ← Go Back
                        </button>
                    </div>
                `;

                // Load Lost & Found posts
                db.collection("lostFound").where("postedBy", "==", userId).get().then(snapshot => {
                    const container = document.getElementById('userPostsList');
                    if (!container) return;
                    if (snapshot.empty) {
                        container.innerHTML = `<p class="text-gray-400 text-xs text-center py-4">No lost or found items posted by this student.</p>`;
                        return;
                    }

                    container.innerHTML = snapshot.docs.map(d => {
                        const item = d.data();
                        return `
                            <div class="border border-gray-100 rounded-xl p-3 flex items-center gap-3 bg-gray-50/50">
                                ${item.imageUrl ? `<img src="${escapeHtml(item.imageUrl)}" class="w-12 h-12 object-cover rounded-lg border">` : '<div class="w-12 h-12 rounded-lg bg-gray-200 flex items-center justify-center text-base">🔍</div>'}
                                <div>
                                    <div class="flex items-center gap-2">
                                        <h4 class="font-bold text-gray-800 text-sm">${escapeHtml(item.name)}</h4>
                                        <span class="text-[10px] px-2 py-0.5 rounded-full font-bold uppercase ${item.type === 'lost' ? 'bg-red-100 text-red-700' : 'bg-green-100 text-green-700'}">${escapeHtml(item.type)}</span>
                                    </div>
                                    <p class="text-xs text-gray-500 mt-0.5">📍 ${escapeHtml(item.location)} • 📞 ${escapeHtml(item.contact)}</p>
                                </div>
                            </div>
                        `;
                    }).join('');
                });

                // Load Marketplace products
                db.collection("products").where("sellerUid", "==", userId).get().then(snapshot => {
                    const container = document.getElementById('userProductsList');
                    if (!container) return;
                    if (snapshot.empty) {
                        container.innerHTML = `<p class="text-gray-400 text-xs text-center py-4">No products currently listed for sale.</p>`;
                        return;
                    }

                    container.innerHTML = snapshot.docs.map(d => {
                        const prod = d.data();
                        return `
                            <div class="border border-gray-100 rounded-xl p-3 flex items-center justify-between gap-3 bg-gray-50/50">
                                <div class="flex items-center gap-3">
                                    ${prod.imageUrl ? `<img src="${escapeHtml(prod.imageUrl)}" class="w-12 h-12 object-cover rounded-lg border">` : '<div class="w-12 h-12 rounded-lg bg-gray-200 flex items-center justify-center text-base">🛒</div>'}
                                    <div>
                                        <h4 class="font-bold text-gray-800 text-sm">${escapeHtml(prod.title)}</h4>
                                        <p class="text-xs text-green-700 font-bold">৳ ${Number(prod.price || 0).toLocaleString()} • ${escapeHtml(prod.condition || '')}</p>
                                    </div>
                                </div>
                                <a href="tel:${escapeHtml(prod.contact)}" class="bg-green-600 hover:bg-green-700 text-white text-xs font-medium px-3 py-1.5 rounded-lg transition shadow-sm">
                                    Contact Seller
                                </a>
                            </div>
                        `;
                    }).join('');
                });

            }).catch(err => {
                console.error("Error loading profile:", err);
                document.getElementById('profileContent').innerHTML = `
                    <div class="bg-white rounded-2xl p-12 text-center border border-gray-100 text-red-500">
                        Error loading profile. Please refresh the page.
                    </div>
                `;
            });
        }
    </script>
</body>
</html>
