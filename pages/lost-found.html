<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lost & Found - RUET Connect</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>
</head>
<body class="bg-gray-50 text-gray-800">

    <!-- ==================== GLOBAL NAVBAR ==================== -->
    <nav id="mainNavbar" class="bg-blue-950 text-white shadow-lg sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
            <a href="../index.html" class="flex items-center gap-2">
                <span class="text-2xl">🎓</span>
                <span class="text-xl font-bold tracking-wide">RUET CONNECT</span>
            </a>
            <div class="h-8 w-24 bg-blue-900/60 rounded-lg animate-pulse"></div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-5xl mx-auto px-4 py-10">

        <!-- Header -->
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-8">
            <div>
                <h1 class="text-3xl font-bold text-gray-900">Lost & Found</h1>
                <p class="text-gray-500 mt-1">Report or search for lost and found items within the RUET campus</p>
            </div>
            <button onclick="openPostModal()" 
                    class="bg-blue-700 hover:bg-blue-800 text-white px-5 py-2.5 rounded-xl font-medium transition shadow-sm flex items-center gap-2">
                <span>+</span> Post Item
            </button>
        </div>

        <!-- Search & Filter Bar -->
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-5 mb-8 flex flex-col sm:flex-row gap-4 justify-between items-center">
            <!-- Filter Pills -->
            <div class="flex gap-2 w-full sm:w-auto">
                <button onclick="filterItems('all')" id="filter-all" class="px-5 py-2 rounded-xl bg-blue-700 text-white text-xs font-semibold shadow-sm transition">All Items</button>
                <button onclick="filterItems('lost')" id="filter-lost" class="px-5 py-2 rounded-xl bg-gray-100 text-gray-700 hover:bg-gray-200 text-xs font-semibold transition">Lost Items</button>
                <button onclick="filterItems('found')" id="filter-found" class="px-5 py-2 rounded-xl bg-gray-100 text-gray-700 hover:bg-gray-200 text-xs font-semibold transition">Found Items</button>
            </div>

            <!-- Search Input -->
            <div class="relative w-full sm:w-72">
                <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-gray-400">🔍</span>
                <input type="text" id="lostFoundSearch" oninput="applyFilters()" 
                       placeholder="Search by name, location..." 
                       class="w-full pl-10 pr-4 py-2 border border-gray-200 rounded-xl text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
        </div>

        <!-- Items List -->
        <div id="itemsList" class="space-y-4">
            <div class="bg-white rounded-2xl p-12 text-center border border-gray-100">
                <div class="w-10 h-10 border-4 border-blue-600 border-t-transparent rounded-full animate-spin mx-auto mb-3"></div>
                <p class="text-gray-400 text-sm">Loading campus items...</p>
            </div>
        </div>

    </main>

    <!-- Post Modal -->
    <div id="postModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50 hidden p-4 overflow-y-auto">
        <div class="bg-white rounded-2xl w-full max-w-md my-8 p-6 shadow-2xl border border-gray-100 animate-fade-up">
            <div class="flex justify-between items-center mb-5 border-b pb-3">
                <div class="flex items-center gap-2">
                    <span class="text-xl">🔍</span>
                    <h2 class="text-lg font-bold text-gray-900">Post Lost / Found Item</h2>
                </div>
                <button onclick="closePostModal()" class="text-gray-400 hover:text-gray-600 text-2xl font-bold leading-none">&times;</button>
            </div>

            <form onsubmit="handlePostSubmit(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-1">Item Name *</label>
                    <input type="text" id="itemName" placeholder="e.g. Casio fx-991EX, Brown Leather Wallet" required
                        class="w-full px-4 py-2.5 border border-gray-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-1">Type *</label>
                        <select id="itemType" required class="w-full px-3 py-2.5 border border-gray-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white">
                            <option value="lost">I Lost This</option>
                            <option value="found">I Found This</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-1">Contact Phone *</label>
                        <input type="tel" id="itemContact" placeholder="01XXXXXXXXX" required
                            class="w-full px-4 py-2.5 border border-gray-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-1">Location *</label>
                    <input type="text" id="itemLocation" placeholder="e.g. Central Library 2nd Floor, Mosque Area" required
                        class="w-full px-4 py-2.5 border border-gray-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-1">Description / Details</label>
                    <textarea id="itemDescription" rows="3" placeholder="Color, brand, distinguishing marks, where to claim..."
                        class="w-full px-4 py-2.5 border border-gray-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-1">Upload Photo (Optional)</label>
                    <input type="file" id="itemImage" accept="image/*" onchange="previewImage(event)"
                        class="w-full text-xs text-gray-500 file:mr-3 file:py-2 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 cursor-pointer">
                    <div id="imagePreviewBox" class="mt-2 hidden">
                        <img id="imagePreview" class="w-full h-36 object-cover rounded-xl border border-gray-200">
                    </div>
                </div>

                <div id="postError" class="hidden text-red-600 text-xs bg-red-50 p-2.5 rounded-lg border border-red-200"></div>

                <div class="flex items-center justify-end gap-3 pt-3 border-t border-gray-100">
                    <button type="button" onclick="closePostModal()" class="px-4 py-2 text-sm text-gray-600 hover:text-gray-800 font-medium">
                        Cancel
                    </button>
                    <button type="submit" id="submitItemBtn" class="bg-blue-700 hover:bg-blue-800 text-white font-medium px-6 py-2.5 rounded-xl text-sm transition shadow-md flex items-center gap-2">
                        <span>Post Item</span>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Firebase Logic -->
    <script src="../js/firebase.js"></script>

    <script>
        let allItems = [];
        let currentFilter = "all";
        let photoBase64 = null;

        document.addEventListener("DOMContentLoaded", () => {
            const urlParams = new URLSearchParams(window.location.search);
            const q = urlParams.get('q');
            if (q) {
                const s = document.getElementById('lostFoundSearch');
                if (s) s.value = q;
            }
            loadItems();
        });

        function openPostModal() {
            if (!auth || !auth.currentUser) {
                alert("Please log in first to report or post an item.");
                window.location.href = "login.html";
                return;
            }
            document.getElementById('postError').classList.add('hidden');
            document.getElementById('imagePreviewBox').classList.add('hidden');
            photoBase64 = null;
            document.getElementById('postModal').classList.remove('hidden');
        }

        function closePostModal() {
            document.getElementById('postModal').classList.add('hidden');
        }

        function previewImage(event) {
            const file = event.target.files[0];
            const previewBox = document.getElementById('imagePreviewBox');
            const previewImg = document.getElementById('imagePreview');
            if (file) {
                if (file.size > 4 * 1024 * 1024) {
                    alert("Image must be smaller than 4MB.");
                    event.target.value = "";
                    return;
                }
                const reader = new FileReader();
                reader.onload = function(e) {
                    photoBase64 = e.target.result;
                    previewImg.src = photoBase64;
                    previewBox.classList.remove('hidden');
                };
                reader.readAsDataURL(file);
            } else {
                previewBox.classList.add('hidden');
                photoBase64 = null;
            }
        }

        async function handlePostSubmit(event) {
            event.preventDefault();
            const name = document.getElementById('itemName').value.trim();
            const type = document.getElementById('itemType').value;
            const location = document.getElementById('itemLocation').value.trim();
            const description = document.getElementById('itemDescription').value.trim();
            const contact = document.getElementById('itemContact').value.trim();
            const fileInput = document.getElementById('itemImage');
            const submitBtn = document.getElementById('submitItemBtn');
            const errorMsg = document.getElementById('postError');

            errorMsg.classList.add('hidden');

            if (!name || !location || !contact) {
                errorMsg.textContent = "Please fill in Item Name, Location, and Contact Number.";
                errorMsg.classList.remove('hidden');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerHTML = `<span>Posting Item...</span>`;

            try {
                let imageUrl = "";
                const file = fileInput.files[0];

                if (file) {
                    if (storage) {
                        try {
                            const storageRef = storage.ref(`lost_found/${Date.now()}_${file.name}`);
                            const snapshot = await storageRef.put(file);
                            imageUrl = await snapshot.ref.getDownloadURL();
                        } catch (storageErr) {
                            console.warn("Storage upload failed, fallback to data URL:", storageErr);
                            imageUrl = photoBase64 || "";
                        }
                    } else if (photoBase64) {
                        imageUrl = photoBase64;
                    }
                }

                const user = auth.currentUser;
                const userDoc = await db.collection("users").doc(user.uid).get();
                const userData = userDoc.exists ? userDoc.data() : {};

                const itemData = {
                    name: name,
                    type: type,
                    location: location,
                    description: description,
                    contact: contact,
                    imageUrl: imageUrl,
                    postedBy: user.uid,
                    postedByName: userData.name || user.displayName || (user.email ? user.email.split('@')[0] : "Student"),
                    postedByStudentId: userData.studentId || (user.email ? user.email.split('@')[0] : ""),
                    postedByDept: userData.department || "",
                    postedByHall: userData.hall || "",
                    createdAt: new Date()
                };

                await db.collection("lostFound").add(itemData);

                closePostModal();
                event.target.reset();
                document.getElementById('imagePreviewBox').classList.add('hidden');
                photoBase64 = null;
            } catch (error) {
                errorMsg.textContent = error.message || "Failed to post item.";
                errorMsg.classList.remove('hidden');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = `<span>Post Item</span>`;
            }
        }

        function loadItems() {
            if (!db) return;
            db.collection("lostFound")
                .orderBy("createdAt", "desc")
                .onSnapshot((snapshot) => {
                    allItems = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    applyFilters();
                }, (error) => {
                    console.error("Firestore read error:", error);
                    document.getElementById('itemsList').innerHTML = `
                        <div class="bg-white rounded-2xl p-12 text-center border border-gray-100 text-red-500">
                            Failed to load items. Please refresh the page.
                        </div>
                    `;
                });
        }

        function filterItems(type) {
            currentFilter = type;
            document.getElementById('filter-all').className = type === 'all' 
                ? "px-5 py-2 rounded-xl bg-blue-700 text-white text-xs font-semibold shadow-sm transition" 
                : "px-5 py-2 rounded-xl bg-gray-100 text-gray-700 hover:bg-gray-200 text-xs font-semibold transition";
            document.getElementById('filter-lost').className = type === 'lost' 
                ? "px-5 py-2 rounded-xl bg-red-600 text-white text-xs font-semibold shadow-sm transition" 
                : "px-5 py-2 rounded-xl bg-gray-100 text-gray-700 hover:bg-gray-200 text-xs font-semibold transition";
            document.getElementById('filter-found').className = type === 'found' 
                ? "px-5 py-2 rounded-xl bg-green-600 text-white text-xs font-semibold shadow-sm transition" 
                : "px-5 py-2 rounded-xl bg-gray-100 text-gray-700 hover:bg-gray-200 text-xs font-semibold transition";
            applyFilters();
        }

        function applyFilters() {
            const term = (document.getElementById('lostFoundSearch')?.value || '').toLowerCase().trim();
            let filtered = allItems.filter(item => {
                const matchType = (currentFilter === "all") || (item.type === currentFilter);
                const nameStr = (item.name || '').toLowerCase();
                const locStr = (item.location || '').toLowerCase();
                const descStr = (item.description || '').toLowerCase();
                const matchSearch = !term || nameStr.includes(term) || locStr.includes(term) || descStr.includes(term);
                return matchType && matchSearch;
            });
            renderItems(filtered);
        }

        function renderItems(items) {
            const container = document.getElementById('itemsList');
            if (items.length === 0) {
                container.innerHTML = `
                    <div class="bg-white rounded-2xl p-12 text-center border border-gray-100">
                        <div class="text-4xl mb-3">🔍</div>
                        <h3 class="text-lg font-bold text-gray-800">No items found</h3>
                        <p class="text-sm text-gray-500 mt-1">No lost or found items match your criteria.</p>
                        <button onclick="openPostModal()" class="mt-4 bg-blue-700 hover:bg-blue-800 text-white text-xs font-medium px-4 py-2 rounded-xl transition">
                            + Post an Item
                        </button>
                    </div>
                `;
                return;
            }

            const currentUid = auth?.currentUser?.uid;

            container.innerHTML = items.map(item => {
                const dateStr = formatDate(item.createdAt);
                const studentIdStr = item.postedByStudentId ? `ID: ${escapeHtml(item.postedByStudentId)}` : '';
                const isOwner = currentUid && (item.postedBy === currentUid);
                const initial = (item.postedByName || "U").charAt(0).toUpperCase();

                return `
                    <div class="bg-white rounded-2xl p-5 shadow-sm border border-gray-100 flex flex-col md:flex-row gap-5 items-start">
                        ${item.imageUrl ? `
                            <div class="w-full md:w-48 h-48 flex-shrink-0 rounded-xl overflow-hidden bg-gray-100 border border-gray-200">
                                <img src="${escapeHtml(item.imageUrl)}" alt="${escapeHtml(item.name)}" class="w-full h-full object-cover hover:scale-105 transition cursor-pointer" onclick="window.open('${escapeHtml(item.imageUrl)}', '_blank')">
                            </div>
                        ` : ''}
                        <div class="flex-1 w-full flex flex-col justify-between self-stretch">
                            <div>
                                <div class="flex justify-between items-start gap-3">
                                    <div class="flex items-center gap-2 mb-1 flex-wrap">
                                        <h3 class="text-xl font-bold text-gray-900">${escapeHtml(item.name)}</h3>
                                        <span class="text-xs px-2.5 py-0.5 rounded-full font-bold uppercase ${item.type === 'lost' ? 'bg-red-100 text-red-700' : 'bg-green-100 text-green-700'}">
                                            ${escapeHtml(item.type)}
                                        </span>
                                    </div>
                                    ${isOwner ? `
                                        <button onclick="deleteLostFoundPost('${item.id}')" title="Delete your post" 
                                                class="text-xs text-red-600 bg-red-50 hover:bg-red-100 px-2.5 py-1.5 rounded-lg font-medium transition flex items-center gap-1">
                                            <span>🗑️</span> Delete
                                        </button>
                                    ` : ''}
                                </div>
                                <p class="text-xs text-gray-500 mb-2">📍 ${escapeHtml(item.location)} ${dateStr ? '• 📅 ' + dateStr : ''}</p>

                                ${item.description ? `<p class="text-xs sm:text-sm text-gray-600 mb-3 bg-gray-50/80 p-3 rounded-xl border border-gray-100">${escapeHtml(item.description)}</p>` : ''}
                            </div>

                            <div class="flex flex-wrap justify-between items-center pt-3 border-t border-gray-100 text-sm gap-2">
                                <a href="view-profile.html?id=${item.postedBy}" class="flex items-center gap-2 hover:opacity-80 transition group">
                                    <div class="w-8 h-8 rounded-full bg-blue-700 text-white flex items-center justify-center text-xs font-bold shadow-sm flex-shrink-0">
                                        ${initial}
                                    </div>
                                    <div>
                                        <span class="font-semibold text-gray-800 text-xs sm:text-sm group-hover:text-blue-600 transition">${escapeHtml(item.postedByName || 'Student')}</span>
                                        ${studentIdStr ? `<span class="text-[10px] text-blue-700 font-mono font-medium block">${studentIdStr}</span>` : ''}
                                        ${(item.postedByDept || item.postedByHall) ? `<span class="text-[10px] text-gray-500 block sm:inline"> (${[item.postedByDept, item.postedByHall].filter(Boolean).join(' • ')})</span>` : ''}
                                    </div>
                                </a>

                                <a href="tel:${escapeHtml(item.contact)}" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-1.5 rounded-lg font-medium text-xs flex items-center gap-1.5 transition shadow-sm">
                                    <span>📞</span> Contact: ${escapeHtml(item.contact)}
                                </a>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        async function deleteLostFoundPost(docId) {
            if (!confirm("Are you sure you want to delete this post?")) return;
            try {
                await db.collection("lostFound").doc(docId).delete();
            } catch (err) {
                alert("Failed to delete post: " + err.message);
            }
        }
    </script>
</body>
</html>
