<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Club Details - RUET Connect</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

</head>
<body class="bg-gray-50 text-gray-800">

            </a>
            <div class="h-8 w-24 bg-blue-900/60 rounded-lg animate-pulse"></div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-4xl mx-auto px-4 py-10">

        <div id="clubDetailsContainer">

                <p class="text-gray-400 text-sm">Loading club details...</p>

            { id: 9, name: "Robotic Society of RUET", short: "RSR", year: "2019", category: "Technical", logo: "../assets/images/clubs/rsr.svg", desc: "Building champion autonomous robots, line-followers, combat bots, and rovers representing RUET in national and international robotics championships." },

            const id = parseInt(urlParams.get('id'), 10);

            const container = document.getElementById('clubDetailsContainer');
            const club = clubs.find(c => c.id === id);

                    <div class="bg-white rounded-2xl p-12 text-center border border-gray-100 shadow-sm">
                        <div class="text-4xl mb-3">🔍</div>
                        <h2 class="text-xl font-bold text-gray-800">Club Not Found</h2>
                        <p class="text-sm text-gray-500 mt-1">The requested club could not be located in the directory.</p>
                        <a href="club-hub.html" class="inline-block mt-4 bg-blue-700 hover:bg-blue-800 text-white font-medium text-xs px-5 py-2.5 rounded-xl transition">
                            ← Back to Club Hub
                        </a>
                    </div>
                `;
                return;
            }

            container.innerHTML = `
                <!-- Club Header Card -->
                <div class="bg-white rounded-2xl p-6 md:p-8 shadow-sm border border-gray-100 mb-8">
                    <div class="flex flex-col sm:flex-row items-center sm:items-start gap-6 text-center sm:text-left">
                        <div class="w-28 h-28 p-3 rounded-2xl bg-slate-50 border border-slate-100 flex items-center justify-center flex-shrink-0 shadow-sm">

                        <div class="flex-1">

                                    ${escapeHtml(club.category)}
                                </span>
                                <span class="bg-gray-100 text-gray-600 text-xs font-semibold px-2.5 py-1 rounded-full font-mono">
                                    Est. ${club.year}
                                </span>
                                <span class="bg-green-100 text-green-700 text-xs font-semibold px-2.5 py-1 rounded-full">
                                    ● Official RUET Club
                                </span>
                            </div>
                            <h1 class="text-2xl md:text-3xl font-bold text-gray-900 leading-tight">

                        </div>

                        <h3 class="text-lg font-bold text-gray-900 mb-3 flex items-center gap-2">
                            <span>📖</span> About the Club
                        </h3>
                        <p class="text-gray-600 text-sm leading-relaxed mb-4">
                            ${escapeHtml(club.desc)}
                        </p>
                        <p class="text-gray-600 text-sm leading-relaxed">
                            Throughout the academic year, ${escapeHtml(club.short)} organizes campus-wide training programs, annual flagship festivals, team mentorship for national competitions, and collaborative community events for RUETians.
                        </p>
                    </div>

                    <div class="bg-white rounded-2xl p-6 shadow-sm border border-gray-100 flex flex-col justify-between">
                        <div>
                            <h3 class="text-lg font-bold text-gray-900 mb-3 flex items-center gap-2">
                                <span>📍</span> Headquarters
                            </h3>
                            <p class="text-xs text-gray-600 leading-relaxed">
                                🏢 Student Activity Center (SAC) / Central Cafeteria Complex<br>
                                🏛️ Rajshahi University of Engineering & Technology<br>
                                📮 Kazla, Rajshahi-6204
                            </p>
                        </div>
                        <div class="mt-4 pt-4 border-t border-gray-100">
                            <span class="text-xs font-bold text-gray-400 uppercase tracking-wider block mb-1.5">Official Membership</span>
                            <span class="text-xs text-green-700 bg-green-50 px-2.5 py-1 rounded-full font-semibold">
                                Open to all RUET Students
                            </span>
                        </div>
                    </div>
                </div>

                <!-- Announcements & Events -->
                <div class="bg-white rounded-2xl p-6 shadow-sm border border-gray-100 mb-8">
                    <h3 class="text-lg font-bold text-gray-900 mb-4 flex items-center gap-2">
                        <span>📢</span> Recent Activities & Upcoming Programs
                    </h3>
                    <div class="space-y-3">

                            </div>
                        </div>
                        <div class="p-4 rounded-xl bg-slate-50 border border-slate-100 flex items-start gap-3">
                            <span class="text-xl">💡</span>
                            <div>
                                <h4 class="font-bold text-gray-800 text-sm">Specialized Hands-on Workshop Series</h4>
                                <p class="text-xs text-gray-500 mt-0.5">Interactive skill sessions facilitated by senior executives and alumni mentors.</p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Navigation Controls -->
                <div class="flex items-center justify-between">
                    <a href="club-hub.html" class="inline-flex items-center gap-2 bg-blue-700 hover:bg-blue-800 text-white font-medium text-sm px-5 py-2.5 rounded-xl transition shadow-sm">

                    </a>
                </div>
            `;
        });

</body>
</html>
