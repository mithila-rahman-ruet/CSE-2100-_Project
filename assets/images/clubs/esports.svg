<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#311042"/>
      <stop offset="100%" stop-color="#581c87"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Outer Rounded Card -->
  <rect width="400" height="400" rx="48" fill="url(#bgGrad)"/>
  
  <!-- Outer Ring Accent -->
  <circle cx="200" cy="200" r="175" fill="none" stroke="#06b6d4" stroke-width="3" stroke-dasharray="8 6" opacity="0.4"/>
  
  <!-- Club Graphic Icon -->
  <g filter="url(#shadow)">
    <path d="M140 170h120c15 0 25 10 20 30l-15 45c-5 10-15 15-25 15h-15l-15-20h-20l-15 20h-15c-10 0-20-5-25-15l-15-45c-5-20 5-30 20-30z" fill="none" stroke="#06b6d4" stroke-width="8"/><path d="M165 190v20M155 200h20" stroke="#06b6d4" stroke-width="6"/><circle cx="225" cy="195" r="6" fill="#f472b6"/><circle cx="240" cy="210" r="6" fill="#f472b6"/>
  </g>
  
  <!-- Club Acronym Text -->
  <text x="200" y="340" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="28" fill="#ffffff" text-anchor="middle" letter-spacing="2" filter="url(#shadow)">
    RUET ESPORTS
  </text>
  
  <!-- RUET Badge Tag -->
  <rect x="150" y="35" width="100" height="24" rx="12" fill="#06b6d4" opacity="0.9"/>
  <text x="200" y="52" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="12" fill="#0f172a" text-anchor="middle" letter-spacing="1">
    RUET
  </text>
</svg>
