<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Outer Rounded Card -->
  <rect width="400" height="400" rx="48" fill="url(#bgGrad)"/>
  
  <!-- Outer Ring Accent -->
  <circle cx="200" cy="200" r="175" fill="none" stroke="#60a5fa" stroke-width="3" stroke-dasharray="8 6" opacity="0.4"/>
  
  <!-- Club Graphic Icon -->
  <g filter="url(#shadow)">
    <circle cx="200" cy="200" r="40" fill="none" stroke="#60a5fa" stroke-width="8"/><ellipse cx="200" cy="200" rx="90" ry="30" fill="none" stroke="#a78bfa" stroke-width="6" transform="rotate(-20 200 200)"/><circle cx="250" cy="140" r="4" fill="#ffffff"/><circle cx="140" cy="250" r="3" fill="#ffffff"/><circle cx="260" cy="240" r="5" fill="#fde047"/>
  </g>
  
  <!-- Club Acronym Text -->
  <text x="200" y="340" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="28" fill="#ffffff" text-anchor="middle" letter-spacing="2" filter="url(#shadow)">
    ASSR
  </text>
  
  <!-- RUET Badge Tag -->
  <rect x="150" y="35" width="100" height="24" rx="12" fill="#60a5fa" opacity="0.9"/>
  <text x="200" y="52" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="12" fill="#0f172a" text-anchor="middle" letter-spacing="1">
    RUET
  </text>
</svg>
